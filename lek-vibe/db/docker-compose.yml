name: mongkol-db

services:
  db:
    image: postgres:16-alpine
    container_name: mongkol-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mongkol
      POSTGRES_USER: mongkol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mongkol_dev_pw}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - mongkol-pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mongkol -d mongkol"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    networks:
      - mongkol-net

volumes:
  mongkol-pgdata:
    name: mongkol-pgdata

networks:
  mongkol-net:
    external: true
